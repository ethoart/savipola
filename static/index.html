<div class="app"><aside class="sidebar"><div class="logo"><div class="logo-icon">🌾</div><div><strong>SaviPola</strong><small>සවිපොළ · SRI LANKA</small></div></div><div class="nav-label">WORKSPACE</div><nav class="nav" id="navigation"></nav><div class="sidebar-spacer"></div><div class="side-card"><strong>🌱 A fairer local economy</strong>One connected platform for farmers, buyers, drivers and skilled workers.<br><br>Demo mode · Sample data</div><div class="sidebar-foot">© 2026 SaviPola · Hackathon MVP</div></aside><main class="main"><header class="topbar"><div class="top-left">COMMUNITY MARKETPLACE<strong id="top-title">Overview</strong></div><div class="profile-box"><div class="avatar" id="avatar">NP</div><select id="profile" aria-label="Switch demo profile"></select></div></header><div class="mobile-nav" id="mobile-nav"></div><div id="content" class="main-content"></div></main></div>
<dialog id="modal"><div id="modal-content"></div></dialog><div id="toast" class="toast" role="status"></div>
<script>
const nav=[['overview','◫','Overview'],['market','🥬','Marketplace'],['inventory','▤','My Harvest'],['demand','📦','Buyer Requests'],['trades','⇄','Trade & Offers'],['transport','🚚','Transport Network'],['workers','👷','SaviWork'],['insights','📊','Fair Price Lab']];
const icon={Tomatoes:'🍅',Carrots:'🥕',Potatoes:'🥔',Cabbage:'🥬',Bananas:'🍌','Green Chilli':'🌶️',Onions:'🧅',Beans:'🫛'};
let S=null,actorId=+(localStorage.getItem('savipola_actor')||1),page='overview',q='',filter='All',notifyTimer;
const $=id=>document.getElementById(id),fmt=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{maximumFractionDigits:0}),nfmt=n=>Number(n||0).toLocaleString('en-LK',{maximumFractionDigits:0}),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const act=()=>S.people.find(p=>p.id===actorId)||S.people[0],person=id=>S.people.find(x=>x.id===id),badge=s=>`<span class="badge ${s==='Pending'?'amber':s==='Rejected'?'gray':s==='Accepted'?'blue':''}">${esc(s)}</span>`,formField=(label,name,type='text',value='',more='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${more} required></div>`,sel=(name,options)=>`<div class="field"><label>${name.replace('_',' ')}</label><select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></div>`,empty=(emoji,title,copy)=>`<div class="empty"><div class="big">${emoji}</div><h3>${title}</h3><p>${copy}</p></div>`;
const btn=(a,label,cl='secondary',data='')=>`<button type="button" class="btn ${cl}" data-a="${a}" ${data}>${label}</button>`;
const title=(k,t,description,right='')=>`<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="subtitle">${description}</p></div>${right}</div>`;
const stat=(i,k,v)=>`<div class="stat"><div class="emoji">${i}</div><div><span>${k}</span><strong>${v}</strong></div></div>`;
async function request(path,method='GET',body){const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json().catch(()=>({detail:'Could not read server response'}));if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
async function refresh(){try{S=await request('/state');if(!S.people.some(p=>p.id===actorId))actorId=1;drawNav();drawProfiles();render()}catch(e){$('content').innerHTML=`<div class="surface">${empty('⚠️','Cannot reach the API',esc(e.message))}<p class="subtitle">Run <code>python app.py</code> in the prototype folder, then open localhost:8000.</p></div>`}}
function drawNav(){const navHtml=nav.map(([id,ic,label])=>`<button data-page="${id}" class="${page===id?'active':''}"><span class="ic">${ic}</span>${label}</button>`).join('');$('navigation').innerHTML=navHtml;$('mobile-nav').innerHTML=nav.map(([id,ic,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${ic} ${label}</button>`).join('')}
function drawProfiles(){const groups=['farmer','buyer','driver','worker'];$('profile').innerHTML=groups.map(g=>`<optgroup label="${g.toUpperCase()}">${S.people.filter(x=>x.role===g).map(p=>`<option value="${p.id}" ${p.id===actorId?'selected':''}>${esc(p.name)} · ${esc(p.role)}</option>`).join('')}</optgroup>`).join('');$('avatar').textContent=act().avatar}
function move(p){page=p;q='';filter='All';drawNav();render();window.scrollTo({top:0,behavior:'smooth'})}
function productCard(p){return `<article class="product"><div class="product-art"><span class="vegetable">${icon[p.crop]||'🌾'}</span><span class="grade">${p.grade==='Unverified'?'◌ Self-check needed':'Self-reported grade '+esc(p.grade)}</span></div><div class="product-info"><h3>${esc(p.crop)}</h3><div class="seller">📍 ${esc(p.district)} · ${esc(p.seller_name)}</div><div><span class="price">${fmt(p.price)}<small> / kg</small></span></div><div class="chips"><span class="chip">${nfmt(p.available_kg)} kg available</span><span class="chip">Guide: ${fmt(p.fair_price)}</span></div><div class="product-footer"><span class="tiny">${p.quality_score?'Quality: '+p.quality_score+'/100':'Unverified quality'}</span>${btn('offer','Make offer','secondary sm',`data-id="${p.id}"`)}</div></div></article>`}
function overview(){let farmer=act().role==='farmer',buyer=act().role==='buyer';const products=S.products.filter(p=>p.available_kg>0),pending=S.offers.filter(o=>o.status==='Pending').length,workers=S.workers.length;return `<div class="hero"><div class="body"><div class="eyebrow">INTRODUCING SAVIPOLA · සවිපොළ</div><h1>Sell the harvest.<br>Connect the whole journey.</h1><p>A farmer in Dambulla. A buyer in Colombo. One connected journey through produce, price, transport and paid local work.</p>${btn(farmer?'addproduct':buyer?'newdemand':'viewmarket',farmer?'+ Add your harvest':buyer?'+ Post a buying request':'Explore marketplace','orange')}</div><div class="hero-orbit"></div><span class="float-emoji e1">🥕</span><span class="float-emoji e2">🚚</span><span class="float-emoji e3">🤝</span></div>
 <div class="callout"><strong>Meet Harvest AI</strong>Describe your harvest in Sinhala, Tamil or English; Gemini on Vertex AI prepares a draft for you to review. <button class="text-btn" data-page="ai">Open Harvest AI →</button></div><div class="stats">${stat('🌾','Produce available',nfmt(products.reduce((a,p)=>a+p.available_kg,0))+' kg')}${stat('🤝','Open buying requests',S.demands.length)}${stat('🚛','Transport options',S.drivers.length)}${stat('👷','Skilled workers',workers)}</div>
 <div class="split"><section class="surface"><div class="surface-head"><h2>Fresh from the farm</h2><button class="text-btn" data-page="market">View marketplace ↗</button></div><div class="listing-grid compact">${products.slice(0,4).map(productCard).join('')}</div></section><section class="surface"><div class="surface-head"><h2>Community pulse</h2><span class="badge">DEMO LIVE</span></div><div class="activity">

function fair(){let names=Object.keys(S.price_reference);return title('SAVIFAIR','Fair price intelligence','Make buyer and seller decisions with an explainable starting price and transparent calculations.')+`<div class="callout"><strong>Important: illustrative price data</strong>These seeded figures are not current market quotations. A deployed system should ingest dated, attributed bulletins from HARTI and clearly show location and update time. No guaranteed "fair" price exists for every grade, lot and delivery agreement.</div><div class="split"><section class="surface"><div class="surface-head"><h2>Reference price board</h2><span class="badge amber">SAMPLE DATA ONLY</span></div><div class="table-wrap"><table><thead><tr><th>Produce</th><th>Illustrative reference</th><th>A grade</th><th>B grade</th></tr></thead><tbody>${names.map(c=>`<tr><td>${icon[c]||'🌿'} ${esc(c)}</td><td>${fmt(S.price_reference[c])}/kg</td><td>${fmt(Math.round(S.price_reference[c]*1.08))}</td><td>${fmt(S.price_reference[c])}</td></tr>`).join('')}</tbody></table></div></section><section class="surface"><div class="surface-head"><h2>How the guide is calculated</h2></div><div class="steps" style="grid-template-columns:1fr 1fr"><div class="step"><strong>1. Reference</strong><p>Commodity benchmark (demonstration dataset)</p></div><div class="step"><strong>2. Quality</strong><p>A: +8% · B: 0% · C: −12%</p></div><div class="step"><strong>3. Lot volume</strong><p>100+ kg: −3% · 300+ kg: −6%</p></div><div class="step"><strong>4. Transparent deal</strong><p>Buyer and farmer negotiate; transport billed separately</p></div></div><div class="hr"></div><p class="subtitle">Example: 300 kg tomatoes, Grade A, Rs. 250/kg sample benchmark → ${fmt(Math.round(250*1.08*.94))}/kg indicative. This model is a discussion aid—not automated price-setting or a claim of market fairness.</p></section></div><section class="surface" style="margin-top:20px"><div class="surface-head"><h2>Transparent deal estimator</h2><span class function updateDeal(){if(page!=='insights'||!$('simResult'))return;const c=$('simCrop').value,g=$('simGrade').value,qty=Math.max(1,Number($('simQty').value)||1),price=Math.max(0,Number($('simPrice').value)||0),transport=Math.max(0,Number($('simTransport').value)||0);const base=S.price_reference[c]||250,grade={'A':1.08,'B':1,'C':0.88,'Unverified':0.98}[g]||1,discount=qty>=300?.06:qty>=100?.03:0,guide=Math.round(base*grade*(1-discount)),delta=Math.round((price-guide)/guide*100);$('simResult').innerHTML=`<div class="two-col"><div><span class="tiny">Seller gross proceeds (before production costs)</span><div class="kpi-text">${fmt(qty*price)}</div></div><div><span class="tiny">Buyer total cost (goods + estimated freight)</span><div class="kpi-text">${fmt(qty*price+transport)}</div></div></div><div class="hr"></div><div class="row-between"><span>Buyer landed price / kg</span><strong>${fmt(price+transport/qty)}</strong></div><div class="row-between" style="margin-top:8px"><span>Illustrative grade-and-volume price guide / kg</span><strong>${fmt(guide)}</strong></div><div class="row-between" style="margin-top:8px"><span>Offer vs guide</span><strong>${delta>=0?'+':''}${delta}%</strong></div><p class="form-hint" style="margin-top:8px">Buyer and seller negotiate independently. The reference guide is not a guaranteed fair price; seller costs and quality must be independently verified.</p>`}

async function submitForm(e){if(!e.target.matches('form[data-kind]'))return;e.preventDefault();const f=e.target,kind=f.dataset.kind,id=+f.dataset.id,fd=Object.fromEntries(new FormData(f).entries());try{let path,body,res;const num=k=>Number(fd[k]);if(kind==='addproduct'){path='/products';body={seller_id:actorId,crop:fd.crop,qty:num('qty'),price:num('price'),district:fd.district,harvested:fd.harvested}}

 else if(kind==='restock'){path=`/products/${id}/restock`;body={actor_id:actorId,qty:num('qty')}}
 else if(kind==='quality'){path='/quality/check';body={actor_id:actorId,product_id:id,freshness:num('freshness'),defects:num('defects'),handling:num('handling'),note:fd.note}}
 else if(kind==='newdemand'){path='/demands';body={buyer_id:actorId,crop:fd.crop,qty:num('qty'),max_price:num('max_price'),district:fd.district}}

 else return;res=await request(path,'POST',body);$('modal').close();toast(kind==='quality'?`Quality score ${res.score}/100 · Grade ${res.grade}. Self-reported, not certified.`:kind==='delivery'?`Transport reserved in demo · quote ${fmt(res.quote_lkr)}`:'Saved successfully — view your updated workspace.');await refresh();}catch(e){$('form-error').textContent=e.message}}

 if(a==='matchoffer'){$('modal').close();return openForm('offer',id)}
 if(['accept','reject','complete','jobcomplete'].includes(a)){if(!confirm(`Confirm: ${a==='complete'?'mark trade fulfilled':a==='jobcomplete'?'mark job completed':a} ?`))return;try{await request(a==='jobcomplete'?`/jobs/${id}/complete`:`/offers/${id}/action`,'POST',a==='jobcomplete'?{actor_id:actorId}:{actor_id:actorId,action:a});toast('Status updated successfully');await refresh()}catch(e){toast(e.message,true)}return}}
